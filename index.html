<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>PICK LIVE</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--bg:#050b14;--panel:#0b1524;--panel2:#101d30;--line:#203149;--text:#eef6ff;--muted:#8496ad;--cyan:#21d4fd;--violet:#8b5cf6;--lime:#7df9c2;--danger:#ff6b81}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#143358 0,transparent 35%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:780px;margin:auto;min-height:100vh;padding-bottom:92px}.top{position:sticky;top:0;z-index:10;padding:17px 16px 13px;background:#050b14dd;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff10}.brand{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:950;font-size:25px;letter-spacing:2px}.logo i{font-style:normal;color:var(--cyan);text-shadow:0 0 18px #21d4fd88}.live{font-size:10px;color:var(--lime);border:1px solid #7df9c255;border-radius:99px;padding:5px 8px}.search{width:100%;margin-top:13px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#0a1423;color:var(--text);outline:none}.search:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #21d4fd18}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.stat{border:1px solid var(--line);background:linear-gradient(145deg,#0e1b2e,#091321);padding:9px 11px;border-radius:13px;font-size:11px;color:var(--muted)}.stat b{display:block;color:#fff;font-size:19px}.main{padding:14px}.hero{background:linear-gradient(135deg,#111e34,#0a1424);border:1px solid #2d4261;border-radius:20px;padding:16px;margin-bottom:13px;box-shadow:0 16px 50px #0005}.hero h2{margin:0 0 6px;font-size:18px}.hero p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}.row{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.pill,button{border:0;cursor:pointer}.pill{white-space:nowrap;background:#0d1a2c;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:9px 12px}.pill.active{color:#06111e;background:linear-gradient(135deg,var(--cyan),var(--lime));font-weight:900;border-color:transparent}.card{position:relative;background:linear-gradient(145deg,#0d192a,#09121f);border:1px solid var(--line);border-radius:19px;padding:15px;margin:12px 0;overflow:hidden}.card.unread:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan);box-shadow:0 0 16px var(--cyan)}.meta{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--muted)}.badge{color:var(--cyan);background:#21d4fd12;border:1px solid #21d4fd35;border-radius:99px;padding:4px 7px}.card h3{font-size:16px;line-height:1.48;margin:10px 0 7px}.card p{color:#a5b4c7;font-size:12px;line-height:1.6;margin:0}.why{font-size:10px;color:#8ea3bc;margin-top:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button,.btn{padding:8px 10px;border-radius:10px;background:#122238;color:#b9c9da}.actions button.on{color:#07111f;background:var(--lime)}.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--violet));color:white;font-weight:900}.btn.danger{color:#ff9aaa}.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:5px 2px 12px}.sectionTitle h2{font-size:20px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{background:#0c1727;border:1px solid var(--line);border-radius:16px;padding:14px}.tile small{color:var(--muted)}.rank{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:12px 0}.rank b{width:25px;color:var(--cyan);font-size:20px}.rank span{flex:1}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#07101deb;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 10px calc(7px + env(safe-area-inset-bottom))}.nav{max-width:780px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:transparent;color:#70839a;font-size:10px;padding:4px}.nav strong{display:block;font-size:18px}.nav button.active{color:var(--cyan)}dialog{width:min(92%,560px);border:1px solid #29415f;border-radius:20px;background:#0a1423;color:var(--text);padding:0}dialog::backdrop{background:#000b}.modal{padding:18px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field input,.field select{width:100%;background:#07111f;color:white;border:1px solid var(--line);border-radius:11px;padding:11px}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.empty{text-align:center;color:var(--muted);padding:38px 10px}.sync{color:var(--muted);font-size:11px;margin:10px 2px}.error{color:#ff9aaa;background:#32131d;border:1px solid #6c2638;padding:11px;border-radius:13px;font-size:12px}@media(max-width:440px){.grid{grid-template-columns:1fr}.main{padding:11px}}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">PICK <i>LIVE</i></div><div id="liveState" class="live">● READY</div></div><input id="search" class="search" placeholder="ニュースを検索"><div id="stats" class="stats"></div></header><main id="main" class="main"></main></div><nav class="bottom"><div class="nav"><button data-page="home" class="active"><strong>⌂</strong>ホーム</button><button data-page="topics"><strong>✦</strong>PICK</button><button data-page="discover"><strong>⌁</strong>発見</button><button data-page="saved"><strong>◇</strong>保存</button><button data-page="settings"><strong>⚙</strong>設定</button></div></nav>
<dialog id="topicDialog"><form id="topicForm" class="modal"><h2>関心事項を追加</h2><div class="field"><label>キーワード</label><input name="name" required placeholder="例：BEAMS、米津玄師、新型RAV4"></div><div class="field"><label>分類</label><select name="type"><option>ショップ</option><option>アーティスト</option><option>商品</option><option>車</option><option>企業</option><option>人物</option><option>自由キーワード</option></select></div><div class="modalActions"><button type="button" class="btn" data-close>戻る</button><button class="btn primary">追加して取得</button></div></form></dialog>
<script>
const DEMO=[{title:'PICK LIVEへようこそ',description:'設定画面にCloudflare Worker URLを登録すると、My PICKのキーワードに一致する日本語ニュースを取得します。',url:'',source:{name:'PICK'},publishedAt:new Date().toISOString(),topic:'セットアップ'}];
let S=JSON.parse(localStorage.getItem('pick-live-v2')||'null')||{topics:[{id:'1',name:'SIXPAD',type:'商品'},{id:'2',name:'新型RAV4',type:'車'},{id:'3',name:'BEAMS',type:'ショップ'}],articles:[],read:{},saved:{},blocked:[],worker:'',page:'home',filter:'unread',updated:null};
const $=q=>document.querySelector(q),main=$('#main'),save=()=>localStorage.setItem('pick-live-v2',JSON.stringify(S)),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id=a=>btoa(unescape(encodeURIComponent(a.url||a.title))).replace(/=/g,'');
function visible(){return S.articles.filter(a=>!S.blocked.some(b=>(a.title+' '+a.description).toLowerCase().includes(b.toLowerCase())))}
function stats(){let A=visible(),u=A.filter(a=>!S.read[id(a)]).length,s=A.filter(a=>S.saved[id(a)]).length;$('#stats').innerHTML=`<div class="stat"><b>${u}</b>未読</div><div class="stat"><b>${A.length-u}</b>既読</div><div class="stat"><b>${s}</b>保存</div>`}
function article(a){let k=id(a),r=!!S.read[k],sv=!!S.saved[k];return `<article class="card ${r?'':'unread'}"><div class="meta"><span class="badge">${esc(a.topic||'NEWS')}</span><span>${esc(a.source?.name||'Web')}</span><span>${new Date(a.publishedAt).toLocaleString('ja-JP')}</span></div><h3>${esc(a.title)}</h3><p>${esc(a.description||'概要は配信元の記事で確認できます。')}</p><div class="why">表示理由：${esc(a.topic||'登録キーワード')}に一致</div><div class="actions"><button data-action="read" data-id="${k}">${r?'↩ 未読へ':'✓ 既読'}</button><button class="${sv?'on':''}" data-action="save" data-id="${k}">${sv?'◆ 保存済み':'◇ 保存'}</button>${a.url?`<button data-open="${encodeURIComponent(a.url)}" data-id="${k}">記事を開く ↗</button>`:''}<button class="btn danger" data-block="${esc(a.topic||'')}">非表示</button></div></article>`}
function home(){let A=visible(),q=$('#search').value.toLowerCase();A=A.filter(a=>!q||(a.title+' '+a.description+' '+a.topic).toLowerCase().includes(q));if(S.filter==='unread')A=A.filter(a=>!S.read[id(a)]);if(S.filter==='read')A=A.filter(a=>S.read[id(a)]);main.innerHTML=`<div class="hero"><h2>NO NOISE. JUST YOUR SIGNAL.</h2><p>登録した関心だけを収集。関連記事や世の中の話題は「発見」に分離します。</p></div><div class="row">${[['unread','未読'],['read','既読'],['all','すべて']].map(x=>`<button class="pill ${S.filter===x[0]?'active':''}" data-filter="${x[0]}">${x[1]}</button>`).join('')}<button class="pill" id="refresh">↻ 更新</button></div><div class="sync">${S.updated?'最終更新 '+new Date(S.updated).toLocaleString('ja-JP'):'未同期'}</div>${A.length?A.map(article).join(''):'<div class="empty">該当するニュースはありません</div>'}`}
function topics(){main.innerHTML=`<div class="sectionTitle"><h2>MY PICK</h2><button class="btn primary" id="add">＋追加</button></div><div class="grid">${S.topics.map(t=>`<div class="tile"><b>${esc(t.name)}</b><br><small>${esc(t.type)}</small><div class="actions"><button data-fetch-one="${esc(t.name)}">今すぐ取得</button><button data-del="${t.id}" class="btn danger">削除</button></div></div>`).join('')}</div>`}
function discover(){let counts={};visible().forEach(a=>counts[a.topic]=(counts[a.topic]||0)+1);let ranks=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10);main.innerHTML=`<div class="sectionTitle"><h2>DISCOVER</h2></div><div class="hero"><h2>関心ランキング</h2><p>現在取得した記事数をもとにしたアプリ内ランキングです。年代別ランキングは公的な年代別データ源を接続するまで、推測表示しません。</p></div><div class="card">${ranks.length?ranks.map((x,i)=>`<div class="rank"><b>${i+1}</b><span>${esc(x[0])}</span><small>${x[1]}件</small></div>`).join(''):'<div class="empty">ニュース取得後に表示されます</div>'}</div>`}
function saved(){let A=visible().filter(a=>S.saved[id(a)]);main.innerHTML=`<div class="sectionTitle"><h2>SAVED</h2></div>${A.length?A.map(article).join(''):'<div class="empty">保存した記事はありません</div>'}`}
function settings(){main.innerHTML=`<div class="sectionTitle"><h2>SETTINGS</h2></div><div class="card"><div class="field"><label>Cloudflare Worker URL</label><input id="worker" value="${esc(S.worker)}" placeholder="https://pick-news.xxxxx.workers.dev"></div><button class="btn primary" id="saveWorker">接続してニュース取得</button><div class="field"><label>ブロックワード</label><input id="blockInput" placeholder="見たくない人物・話題"></div><button class="btn" id="addBlock">追加</button><div class="row" style="margin-top:12px">${S.blocked.map((b,i)=>`<button class="pill" data-unblock="${i}">${esc(b)} ×</button>`).join('')}</div></div>`}
async function fetchNews(only){if(!S.worker){S.page='settings';render();alert('先にCloudflare Worker URLを設定してください');return}let topics=only?[only]:S.topics.map(t=>t.name);if(!topics.length)return;$('#liveState').textContent='● SYNCING';try{let u=S.worker.replace(/\/$/,'')+'/?q='+encodeURIComponent(topics.join('|'));let res=await fetch(u);if(!res.ok)throw Error('HTTP '+res.status);let data=await res.json();if(!Array.isArray(data.articles))throw Error('ニュース形式が不正です');let old=new Map(S.articles.map(a=>[a.url||a.title,a]));data.articles.forEach(a=>old.set(a.url||a.title,a));S.articles=[...old.values()].sort((a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt)).slice(0,200);S.updated=Date.now();save();$('#liveState').textContent='● LIVE';render()}catch(e){$('#liveState').textContent='● ERROR';main.innerHTML=`<div class="error">取得できませんでした：${esc(e.message)}<br>Worker URLとデプロイ状態を確認してください。</div>`}}
function render(){stats();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===S.page));({home,topics,discover,saved,settings}[S.page]||home)();save()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){S.page=b.dataset.page;render()}if(b.dataset.filter){S.filter=b.dataset.filter;render()}if(b.id==='refresh')fetchNews();if(b.id==='add')$('#topicDialog').showModal();if(b.dataset.close)$('#topicDialog').close();if(b.dataset.del){S.topics=S.topics.filter(t=>t.id!==b.dataset.del);render()}if(b.dataset.fetchOne)fetchNews(b.dataset.fetchOne);if(b.dataset.action){S[b.dataset.action==='read'?'read':'saved'][b.dataset.id]=!S[b.dataset.action==='read'?'read':'saved'][b.dataset.id];render()}if(b.dataset.open){S.read[b.dataset.id]=true;save();window.open(decodeURIComponent(b.dataset.open),'_blank','noopener')}if(b.dataset.block){if(b.dataset.block&&!S.blocked.includes(b.dataset.block))S.blocked.push(b.dataset.block);render()}if(b.id==='saveWorker'){S.worker=$('#worker').value.trim();save();fetchNews()}if(b.id==='addBlock'){let v=$('#blockInput').value.trim();if(v&&!S.blocked.includes(v))S.blocked.push(v);render()}if(b.dataset.unblock!==undefined){S.blocked.splice(+b.dataset.unblock,1);render()}});
$('#topicForm').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.currentTarget),name=f.get('name').trim();S.topics.push({id:crypto.randomUUID(),name,type:f.get('type')});e.currentTarget.reset();$('#topicDialog').close();S.page='topics';render();fetchNews(name)});$('#search').addEventListener('input',()=>{S.page='home';home()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});if(!S.articles.length)S.articles=DEMO;render();
</script></body></html>
